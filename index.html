<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NgoosNghienGames</title>
<meta name="description" content="Small, simple mobile games by NgoosNghienGames.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&display=swap">
<style>
  :root{--bg:#f6f2e7;--paper:#fffdf7;--ink:#18302f;--muted:#56706d;--line:#e2dccb;--accent:#0f5c5f;--chip:#eaf3f1}
  @media (prefers-color-scheme: dark){:root{color-scheme:dark;--bg:#0b2629;--paper:#10312f;--ink:#f1ecde;--muted:#9cc3c0;--line:#23504f;--accent:#7fd9c8;--chip:#173f3e}}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:48px 64px}
  .wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
  h1{font:800 clamp(34px,7vw,52px)/1.05 "Baloo 2",system-ui,sans-serif;margin:0}
  .lead{color:var(--muted);margin:6px 0 0;max-width:60ch}
  .game{display:flex;gap:18px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;flex-wrap:wrap}
  .game img{width:96px;height:96px;border-radius:22px;flex:none}
  .game h2{font:800 26px/1.1 "Baloo 2",system-ui,sans-serif;margin:0}
  .game p{margin:4px 0 10px;color:var(--muted)}
  .links{display:flex;gap:8px;flex-wrap:wrap}
  .links a,.links span{padding:7px 14px;border-radius:999px;background:var(--chip);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}
  .links span{opacity:.6}
  .links a:focus-visible{outline:3px solid #ffb52e;outline-offset:2px}
  footer{color:var(--muted);font-size:14px}
  footer b{user-select:all;color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NgoosNghienGames</h1>
    <p class="lead">Small, simple mobile games you can pick up with one finger.</p>
  </header>

  <section class="game">
    <img src="break-the-eggs/icon.png" alt="Break The Eggs icon">
    <div>
      <h2>Break The Eggs</h2>
      <p>Tap on the beat to crack 10 eggs, then break the Boss Egg at 999 points.</p>
      <div class="links">
        <span>Google Play – coming soon</span>
        <a href="break-the-eggs/privacy/">Privacy policy</a>
      </div>
    </div>
  </section>

  <footer>Contact: <b>ngoosnghiengames@gmail.com</b></footer>
</div>
</body>
</html>
